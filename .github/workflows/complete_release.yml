name: Add full archives to a release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.4.2
        required: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        variant: [base, cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Make room on the disk
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - name: Write and add the archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/complete_release.py "$TAG" "${{ matrix.platform }}" "${{ matrix.variant }}"
